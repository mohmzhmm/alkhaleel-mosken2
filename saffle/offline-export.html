<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>تصدير شاشة سيفله دون إنترنت</title><style>body{font:20px Arial;background:#1a2933;color:#f5f2ea;max-width:800px;margin:60px auto;padding:24px;line-height:1.7}button{background:#d2ba8b;color:#1a2933;padding:16px;font:inherit;border:0;border-radius:12px;cursor:pointer}pre{white-space:pre-wrap}</style><h1>شاشة مسجد سيفله دون إنترنت</h1><p>نزّل المواقيت والإقامة والنصوص وإعدادات الشاشة الحالية، ثم ضع الملف في مجلد RaspberryPi-Saffle بدلًا من الملف الذي يحمل الاسم نفسه.</p><button id="download">تنزيل بيانات مسجد سيفله</button><pre id="status"></pre><script src="../config.js"></script><script>
const MOSQUE='00000000-0000-4000-8000-000000000002';
const status=document.getElementById('status'),button=document.getElementById('download');
async function getRows(path){const config=window.ALKHALEEL_SUPABASE;if(!config?.url||!config?.key)throw Error('تعذر قراءة إعدادات الاتصال من config.js');let all=[];for(let offset=0;offset<100000;offset+=500){const r=await fetch(config.url.replace(/\/$/,'')+'/rest/v1/'+path+'&order=prayer_date.asc&limit=500&offset='+offset,{headers:{apikey:config.key},cache:'no-store'});if(!r.ok)throw Error('فشل تحميل المواقيت: '+r.status);const rows=await r.json();if(!Array.isArray(rows))throw Error('نتيجة المواقيت غير صحيحة');all.push(...rows);if(rows.length<500)return all;}throw Error('عدد الأيام تجاوز الحد المسموح');}
async function request(path,body){const config=window.ALKHALEEL_SUPABASE;const r=await fetch(config.url.replace(/\/$/,'')+'/rest/v1/'+path,{method:body?'POST':'GET',headers:{apikey:config.key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error('فشل تحميل البيانات: '+r.status);return r.json();}
button.onclick=async()=>{button.disabled=true;status.textContent='جارٍ تحميل البيانات…';try{
const [days,rules,contents,layouts]=await Promise.all([getRows('effective_prayer_times?select=prayer_date,fajr,sunrise,dhuhr,asr,maghrib,isha&mosque_id=eq.'+MOSQUE),request('iqama_rules?select=prayer,mode,value,valid_from,valid_to&mosque_id=eq.'+MOSQUE+'&order=valid_from.asc'),request('mosque_display_content?select=news_ar,news_sv,ticker_label,ticker_text,is_configured&mosque_id=eq.'+MOSQUE+'&id=eq.1&limit=1'),request('rpc/get_public_mosque_screen_layout',{p_mosque_id:MOSQUE,p_screen_key:'alkhaleel-mosken2'})]);
if(!days.length)throw Error('لم يتم العثور على مواقيت لمسجد سيفله');for(const day of days){if(!/^\d{4}-\d{2}-\d{2}$/.test(day.prayer_date))throw Error('تاريخ غير صحيح');for(const key of ['fajr','sunrise','dhuhr','asr','maghrib','isha'])if(!/^([01]\d|2[0-3]):[0-5]\d/.test(String(day[key])))throw Error('وقت غير صحيح: '+day.prayer_date+' '+key);}
const snapshot={version:1,mosqueId:MOSQUE,exportedAt:new Date().toISOString(),days,rules,content:contents[0]||null,layout:layouts[0]?.settings||{}};
const url=URL.createObjectURL(new Blob(['window.SAFFLE_OFFLINE_DATA='+JSON.stringify(snapshot)+';\n'],{type:'text/javascript;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='saffle-data.js';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='تم تنزيل '+days.length+' يومًا.\nمن '+days[0].prayer_date+' إلى '+days[days.length-1].prayer_date+'\nلا تستخدم الشاشة خارج هذه الفترة. تأكد أن اسم الملف saffle-data.js دون رقم إضافي.';
}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};
</script></html>
